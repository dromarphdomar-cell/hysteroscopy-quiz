<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parasitology Challenge</title><style>body{margin:0;background:#fbf2f1;font-family:Arial,sans-serif;color:#322331}.wrap{max-width:760px;margin:35px auto;padding:24px}header{background:#8c425a;color:white;border-radius:22px;padding:30px;text-align:center}h1{margin:0 0 8px}.card{background:white;border:1px solid #e9ccd1;border-radius:18px;padding:20px;margin:18px 0;box-shadow:0 5px 15px #00000009}h3{margin-top:0}label{display:block;padding:10px;border-radius:8px;cursor:pointer}label:hover{background:#f8e8eb}button{border:0;background:#758263;color:white;padding:16px 32px;border-radius:12px;font-weight:bold;cursor:pointer;font-size:18px}#result{font-size:22px;font-weight:bold;margin:20px 0}.ok{color:#347047}.bad{color:#a6384c}footer{text-align:center;color:#666}</style></head><body><div class="wrap"><header><h1>🦠 Parasitology Challenge</h1><p>Enterobiasis & Ascariasis • Interactive MCQ Quiz</p></header><div id="questions"></div><button onclick="grade()">Submit Answers</button><div id="result" aria-live="polite"></div><footer>British University in Egypt × Queen Margaret University • Educational quiz</footer></div><script>
const qs=[
['What organism causes enterobiasis?',['Ascaris lumbricoides','Enterobius vermicularis','Giardia lamblia','Taenia saginata'],1],
['What is the classic symptom of pinworm infection?',['Nighttime perianal itching','Jaundice','Hemoptysis','Severe chest pain'],0],
['Which test is preferred for diagnosing pinworm?',['Blood culture','Morning adhesive tape test','Urine dipstick','Chest CT'],1],
['Why is pinworm medication commonly repeated after 2 weeks?',['To treat newly hatched worms','To reduce fever','To treat bacteria','To improve appetite'],0],
['How is ascariasis typically acquired?',['Mosquito bite','Ingestion of embryonated eggs','Skin penetration by larvae','Blood transfusion'],1],
['Where do Ascaris larvae migrate after entering the bloodstream?',['Brain','Lungs','Kidneys','Bladder'],1],
['What may occur during the pulmonary phase of ascariasis?',['Löffler syndrome','Otitis media','Conjunctivitis','Cystitis'],0],
['Which test can detect Ascaris eggs?',['Microscopic stool examination','Throat swab','ECG','Skin prick test'],0],
['What is a serious complication of heavy Ascaris infection?',['Intestinal obstruction','Cataracts','Fracture','Epistaxis'],0],
['Which is a standard single-dose treatment option for ascariasis?',['Albendazole 400 mg','Amoxicillin 500 mg','Metformin 500 mg','Paracetamol 500 mg'],0],
['What is an important nursing priority when a child has severe abdominal pain and vomiting?',['Urgent assessment and referral','Give a large meal','Delay reporting','Encourage vigorous exercise'],0],
['Which action helps prevent both infections?',['Handwashing and safe sanitation','Sharing towels','Skipping handwashing','Eating unwashed vegetables'],0]
];
const root=document.getElementById('questions');root.innerHTML=qs.map((q,i)=>`<section class="card" id="q${i}"><h3>${i+1}. ${q[0]}</h3>${q[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${a}</label>`).join('')}<p class="feedback"></p></section>`).join('');
function grade(){let score=0;qs.forEach((q,i)=>{let chosen=document.querySelector(`input[name=q${i}]:checked`);let good=chosen&&Number(chosen.value)===q[2];if(good)score++;let fb=document.querySelector(`#q${i} .feedback`);fb.textContent=(good?'✓ Correct':'✗ Correct answer: '+q[1][q[2]]);fb.className='feedback '+(good?'ok':'bad')});document.getElementById('result').textContent=`Your score: ${score}/${qs.length} (${Math.round(score/qs.length*100)}%)`;document.getElementById('result').scrollIntoView({behavior:'smooth'});}
</script></body></html>
